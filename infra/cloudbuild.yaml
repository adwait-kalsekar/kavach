# Optional build/push only; GitHub Actions is the production deployment controller.
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, infra/Dockerfile.api, --target, builder, -t, kavach-builder, .]
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, infra/Dockerfile.api, -t, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/kavach-api:$BUILD_ID", .]
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, infra/Dockerfile.web, -t, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/kavach-web:$BUILD_ID", .]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/kavach-api:$BUILD_ID"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/kavach-web:$BUILD_ID"
substitutions:
  _REGION: asia-south1
  _REPOSITORY: kavach
options:
  logging: CLOUD_LOGGING_ONLY
